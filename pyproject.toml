[project]
name = "ftquant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "gguf",
    "matplotlib>=3.11.2",
    "mlx-lm>=0.31.3",
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
ftquant = "ftquant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftquant"]

[tool.uv.workspace]
members = [
    "vendor/llama.cpp/gguf-py",
]

[tool.uv.sources]
gguf = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
